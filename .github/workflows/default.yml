name: Python package

on: [push, pull_request]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.15"]

    steps:
      - uses: actions/checkout@v7
      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint with flake8
        run: uv run flake8 . --exclude .git,.venv --max-line-length 120 --count --show-source --statistics
      - name: Test with unittest
        run: uv run python -m unittest -v test_ImageCollection
      - name: Build package
        run: uv build
      - name: Release
        uses: docker://antonyurchenko/git-release:v7.0.0
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: dist/*.whl dist/*.tar.gz
